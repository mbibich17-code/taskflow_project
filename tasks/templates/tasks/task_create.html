{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Créer une tâche - TaskFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="mb-3">
            <a href="{% url 'task_list' %}" class="text-secondary text-decoration-none fw-medium">&larr; Retour à la liste</a>
        </div>
                <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <span class="fs-1">+</span>
                    <h2 class="mt-2 fw-bold text-dark">Nouvelle Tâche</h2>
                    <p class="text-muted">Définissez une nouvelle priorité ou un objectif académique.</p>
                </div>
                <form method="post" action="{% url 'task_create' %}" class="needs-validation">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'task_list' %}" class="btn btn-outline-secondary rounded-3 px-4">Annuler</a>
                        <button type="submit" class="btn btn-primary text-white rounded-3 px-4">Créer la tâche</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
