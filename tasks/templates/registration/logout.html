{% extends "base.html" %}

{% block title %}Déconnexion - TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4 text-center">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <h2 class="mt-2 fw-bold text-dark">Déconnecté</h2>
                    <p class="text-muted">Vous avez été déconnecté avec succès de votre session.</p>
                </div>
                
                <p class="text-secondary small mb-4">Merci d'avoir utilisé TaskFlow pour organiser vos priorités de la journée.</p>
                
                <div class="d-grid gap-2">
                    <a href="{% url 'login' %}" class="btn btn-primary rounded-3">Se reconnecter</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
