{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Connexion - TaskFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="mt-2 fw-bold text-dark">Connexion</h2>
                    <p class="text-muted">Accédez à vos tâches et organisez votre journée</p>
                </div>
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3 fs-6">Se connecter</button>
                    </div>
                </form>
                <hr class="my-4 text-muted">
                <div class="text-center">
                    <p class="mb-0 text-muted">Vous n'avez pas de compte ?</p>
                    <a href="{% url 'register' %}" class="text-primary fw-medium text-decoration-none">Créer un compte maintenant</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
